media:
  input: public/images
  output: /images
  rename: safe
  categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: eyebrow, label: Small homepage line, type: string, required: true }
      - { name: headline, label: Homepage headline, type: text, required: true }
      - { name: introduction, label: Short introduction, type: text, required: true }
      - { name: about, label: About summary, type: text, required: true }
      - { name: location, label: Location, type: string }
      - { name: email, label: Public email, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: cv, label: CV PDF path or URL, type: string, description: "Use files/Anthony-Christiana-CV.pdf or a full https URL." }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - name: socials
        label: Other social profiles
        type: object
        list: true
        fields:
          - { name: label, label: Platform name, type: string, required: true }
          - { name: url, label: Profile URL, type: string, required: true }

  - name: writing
    label: Writing & Projects
    type: collection
    path: src/content/writing
    format: yaml-frontmatter
    view: { primary: title, sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Short description, type: text, required: true }
      - { name: date, label: Publication date, type: date, required: true }
      - { name: type, label: Type, type: string, description: "Use Writing or Project." }
      - { name: youtubeIds, label: YouTube video IDs, type: string, list: true, description: "For project posts, use only the ID after youtu.be/ or ?v=." }
      - { name: videoTitles, label: Video titles, type: string, list: true }
      - { name: github, label: GitHub project URL, type: string }
      - { name: featured, label: Feature on homepage, type: boolean }
      - { name: draft, label: Hide as draft, type: boolean }
      - { name: image, label: Cover image, type: image }
      - name: body
        label: Article
        type: rich-text
        options: { media: true, path: public/images/writing }

  - name: research
    label: Research
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    view: { primary: title, sort: year, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Short description, type: text, required: true }
      - { name: year, label: Year, type: number, required: true }
      - name: kind
        label: Type
        type: string
        description: Research area, Paper, Preprint, Talk, Project, Thesis, or Poster
        required: true
      - { name: date, label: Display date, type: string, description: "For example: April 24, 2026. If blank, the year is shown." }
      - { name: venue, label: Journal or venue, type: string }
      - { name: authors, label: Authors, type: text }
      - { name: status, label: Publication status, type: text }
      - { name: arxiv, label: arXiv URL, type: string }
      - { name: doi, label: DOI or publisher URL, type: string }
      - { name: url, label: Paper or project URL, type: string }
      - { name: pdf, label: Embedded PDF path or URL, type: string, description: "Use a path such as files/talks/slides.pdf or a full https URL." }
      - { name: pdfReady, label: Show embedded PDF, type: boolean }
      - { name: youtubeIds, label: YouTube video IDs, type: string, list: true, description: "Use only the ID after youtu.be/ or ?v=. Use TODO as a placeholder." }
      - { name: videoTitles, label: Video titles, type: string, list: true }
      - { name: github, label: GitHub project URL, type: string }
      - { name: showGithubPlaceholder, label: Show GitHub placeholder, type: boolean }
      - { name: featured, label: Feature on homepage, type: boolean }
      - { name: featuredOrder, label: Homepage featured order, type: number, description: "Use 1, 2, 3, and so on for featured items." }
      - { name: body, label: Longer description, type: rich-text }

  - name: teaching
    label: Teaching
    type: collection
    path: src/content/teaching
    format: yaml-frontmatter
    view: { primary: title, sort: term, order: desc }
    fields:
      - { name: title, label: Course or project title, type: string, required: true }
      - { name: description, label: Short description, type: text, required: true }
      - { name: term, label: Term, type: string, description: "For courses and ongoing teaching entries." }
      - { name: institution, label: Institution, type: string }
      - { name: url, label: Course or resource URL, type: string }
      - { name: year, label: Year, type: number, description: "For talks and projects." }
      - name: kind
        label: Type
        type: string
        description: Talk or Project for a Teaching post; leave blank for a course entry.
      - { name: date, label: Display date, type: string, description: "For example: April 24, 2026." }
      - { name: venue, label: Venue, type: string }
      - { name: authors, label: Authors, type: text }
      - { name: status, label: Status, type: text }
      - { name: arxiv, label: arXiv URL, type: string }
      - { name: doi, label: DOI or publisher URL, type: string }
      - { name: pdf, label: Embedded PDF path or URL, type: string, description: "Use a path such as files/talks/slides.pdf or a full https URL." }
      - { name: pdfReady, label: Show embedded PDF, type: boolean }
      - { name: youtubeIds, label: YouTube video IDs, type: string, list: true, description: "Use only the ID after youtu.be/ or ?v=. Use TODO as a placeholder." }
      - { name: videoTitles, label: Video titles, type: string, list: true }
      - { name: github, label: GitHub project URL, type: string }
      - { name: showGithubPlaceholder, label: Show GitHub placeholder, type: boolean }
      - { name: featured, label: Featured, type: boolean }
      - { name: featuredOrder, label: Homepage featured order, type: number, description: "Use 1, 2, 3, and so on for featured items." }
      - { name: order, label: Teaching page order, type: number, description: "Lower numbers appear first." }
      - { name: body, label: Longer description, type: rich-text }

settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} to {filename}"
